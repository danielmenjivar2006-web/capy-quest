<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#222747"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Capy Quest · Word Kingdom</title><style>
:root{--bg:#11142b;--panel:#222747;--panel2:#303657;--text:#f7f5ff;--muted:#c7c8e2;--gold:#ffd76a;--green:#71e1b0;--pink:#ff9bbd;--blue:#8fbaff;--shadow:#090b1e}*{box-sizing:border-box}body{margin:0;font:500 16px/1.5 system-ui,'Segoe UI',sans-serif;background:radial-gradient(circle at 10% 0%,#3a3169 0,transparent 35%),radial-gradient(circle at 92% 75%,#234660 0,transparent 38%),var(--bg);color:var(--text);min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.shell{max-width:1080px;margin:auto;padding:18px 18px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{width:56px;height:56px;display:grid;place-items:center;background:#477c65;border-radius:20px;font-size:35px;box-shadow:0 6px 0 #1c4b3b;transform:rotate(-5deg)}.brand h1{font-size:22px;margin:0;line-height:1.1}.brand p{font-size:12px;margin:5px 0 0;color:var(--muted)}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{border:1px solid #525677;background:#262c4c;border-radius:100px;padding:7px 13px;font-weight:800}.main{margin-top:24px}.hero{padding:28px;border:1px solid #7778aa;border-radius:28px;background:linear-gradient(130deg,#3c4079,#2b355c 65%,#244d54);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;box-shadow:0 15px 50px #0b0c2070}.hero h2{font-size:clamp(27px,4vw,43px);line-height:1.14;margin:8px 0}.hero p{max-width:660px;color:#e3e5f3}.hero .mascot{font-size:clamp(90px,16vw,160px);filter:drop-shadow(0 10px 1px #141c3d)}.eyebrow{color:var(--gold);font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.primary,.secondary,.answer,.tile{border:0;border-radius:15px;padding:13px 18px;font-weight:900;transition:transform .15s,background .15s}.primary{background:var(--gold);color:#242443;box-shadow:0 5px 0 #bc8e36}.primary:hover,.secondary:hover,.answer:hover,.tile:hover{transform:translateY(-2px)}.secondary{background:#434a75;color:white;border:1px solid #757bad}.primary:disabled,.secondary:disabled{opacity:.55;cursor:not-allowed;transform:none}.sectionhead{margin:28px 0 12px;display:flex;align-items:center;justify-content:space-between}.sectionhead h3{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.world{background:var(--panel);border:1px solid #464d78;border-radius:23px;padding:21px;min-height:204px;display:flex;flex-direction:column;align-items:flex-start;box-shadow:0 7px 0 #0b0d24}.world .symbol{font-size:42px}.world h4{font-size:21px;margin:10px 0 5px}.world p{color:var(--muted);font-size:14px;margin:0 0 18px}.world button{margin-top:auto}.tag{font-size:13px;color:var(--green);font-weight:900}.activity{background:var(--panel);border:1px solid #515987;border-radius:25px;padding:clamp(18px,4vw,30px);box-shadow:0 9px 0 #0c102a}.activity h2{font-size:clamp(24px,3vw,34px);margin:10px 0}.activity p{color:var(--muted)}.panel{background:var(--panel2);border-radius:18px;padding:20px;margin:18px 0}.panel p{color:var(--text)}.big{font-size:clamp(28px,5vw,44px);font-weight:900;text-align:center;margin:20px 0}.focus{color:var(--gold);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}.focus-word{display:inline-block;color:#221b35;background:#ffe17c;border:3px solid #ffca42;padding:0 .15em;border-radius:.2em;box-shadow:0 4px 0 #bd8b32;font-weight:1000;line-height:1.25}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.answer{background:#394266;color:white;min-height:68px;border:2px solid #66729c;text-align:center;font-size:17px}.answer.good{background:#21654f;border-color:var(--green)}.answer.bad{background:#70374f;border-color:var(--pink)}.answer:disabled{cursor:default;opacity:1}.notice{padding:16px;border-radius:16px;margin-top:16px;font-weight:750}.notice.success{background:#1d6046;color:#d5ffed}.notice.error{background:#75354d;color:#ffe2ea}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.progress{height:12px;background:#131833;border-radius:100px;overflow:hidden;margin:12px 0 22px}.fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .3s}.story{font-size:clamp(19px,2.6vw,24px);line-height:2;letter-spacing:.2px}.story strong{color:var(--gold)}.field{width:100%;padding:14px;border-radius:12px;border:2px solid #7c87bc;background:#171d39;color:white;font-size:18px}.tip{font-size:14px!important;color:#fff0b3!important}.mini{background:transparent;border:0;color:var(--gold);text-decoration:underline;font-weight:800;padding:0 4px}.tiles{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.tile{background:#d1daff;color:#222a4d;min-width:78px}.selected{border:2px dashed var(--green);background:#1b2643;border-radius:13px;min-height:62px;padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.selected span{background:#3e5471;padding:5px 10px;border-radius:10px}.footer{text-align:center;color:#aeb3cf;font-size:13px;margin-top:32px}.hidden{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero .mascot{display:none}.answers{grid-template-columns:1fr}.top{align-items:flex-start}.shell{padding:14px}.chips{font-size:13px}}
@media(max-width:700px){.shell{padding:12px 12px calc(22px + env(safe-area-inset-bottom))}.brand h1{font-size:19px}.logo{height:45px;width:45px;font-size:29px;border-radius:13px}.brand p{font-size:10px}.top{gap:12px}.chips{width:100%;justify-content:space-between;gap:5px}.chip{padding:6px 9px;font-size:12px}.main{margin-top:16px}.hero{padding:20px}.hero h2{font-size:27px}.activity{padding:18px 15px}.activity h2{font-size:25px}.panel{padding:14px;margin:13px 0}.big{font-size:clamp(24px,7vw,40px);overflow-wrap:anywhere;line-height:1.6}.answer,.primary,.secondary,.tile{min-height:52px;touch-action:manipulation}.answer{font-size:17px;padding:14px}.grid{gap:11px}.world{min-height:0;padding:18px}.world h4{font-size:20px}.actions{gap:9px}.actions button{flex-grow:1}.story{font-size:19px;line-height:1.85}.field{font-size:16px;min-height:54px}.sectionhead{gap:8px;flex-wrap:wrap}.focus-word{box-decoration-break:clone;-webkit-box-decoration-break:clone}}@media(max-width:380px){.brand h1{font-size:17px}.chip{font-size:11px;padding:6px 7px}.hero h2{font-size:24px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="logo" aria-hidden="true">🦫</div><div><h1>CAPY QUEST</h1><p>WORD KINGDOM · English Academy</p></div></div><div class="chips"><div class="chip" id="coin">🪙 0</div><div class="chip" id="star">⭐ 0</div><div class="chip" id="done">🏆 0/4</div></div></header><main class="main" id="app"></main><footer class="footer">Aprender jugando está bien. Equivocarse también. 💛 · El progreso se guarda en este navegador.</footer></div><script>
'use strict';const KEY='capy-word-kingdom-v1';let saved={coins:0,stars:0,finished:{}};try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}let game=null;const $=id=>document.getElementById(id);const app=$('app');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}hud()}function hud(){$('coin').textContent='🪙 '+saved.coins;$('star').textContent='⭐ '+saved.stars;$('done').textContent='🏆 '+Object.keys(saved.finished).length+'/4'}function speak(t){if(!('speechSynthesis'in window)){alert('Tu navegador no admite voz. Usa Chrome o Edge.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;u.pitch=1.07;speechSynthesis.speak(u)}const definitions={noun:{name:'NOUN',es:'Sustantivo',emoji:'🐶',intro:'Nombra una persona, animal, lugar o cosa.',ex:'dog · school · capybara · ball',color:'#8fbaff'},verb:{name:'VERB',es:'Verbo',emoji:'🏃',intro:'Cuenta qué hace alguien o qué sucede.',ex:'run · jump · eat · read',color:'#71e1b0'},adjective:{name:'ADJECTIVE',es:'Adjetivo',emoji:'🌈',intro:'Describe cómo es una persona, animal o cosa.',ex:'happy · big · red · fast',color:'#ff9bbd'}};const qs=[['The <mark class="focus-word">capybara</mark> eats an apple.','capybara','noun','Capybara es un animal.'],['Capi <mark class="focus-word">runs</mark> to school.','runs','verb','Runs dice qué hace Capi.'],['The ball is <mark class="focus-word">red</mark>.','red','adjective','Red describe el color de la pelota.'],['My <mark class="focus-word">teacher</mark> is kind.','teacher','noun','Teacher es una persona.'],['The cat <mark class="focus-word">jumps</mark> high.','jumps','verb','Jumps es una acción.'],['I have a <mark class="focus-word">small</mark> dog.','small','adjective','Small describe el tamaño del perro.'],['The <mark class="focus-word">park</mark> is beautiful.','park','noun','Park es un lugar.'],['We <mark class="focus-word">play</mark> after school.','play','verb','Play es una acción.'],['She has a <mark class="focus-word">happy</mark> smile.','happy','adjective','Happy describe cómo es la sonrisa.'],['The <mark class="focus-word">book</mark> is new.','book','noun','Book es una cosa.'],['They <mark class="focus-word">read</mark> every day.','read','verb','Read es una acción.'],['The rabbit is <mark class="focus-word">fast</mark>.','fast','adjective','Fast describe al conejo.']];const story='Capi is a <strong>small</strong> capybara. He lives near a <strong>big</strong> river. Every morning, Capi <strong>runs</strong> to the park. He sees a <strong>happy</strong> dog. The dog has a red ball. Capi and the dog play together.';const comprehension=[{q:'Where does Capi live?',opts:['Near a river','In a school','In a castle'],a:0,why:'La historia dice: He lives near a big river.'},{q:'What does Capi do every morning?',opts:['He sleeps','He runs to the park','He eats pizza'],a:1,why:'Cada mañana Capi runs to the park.'},{q:'Who has a red ball?',opts:['The dog','The teacher','The cat'],a:0,why:'The dog has a red ball.'},{q:'Which word describes the river?',opts:['runs','big','dog'],a:1,why:'Big describe el tamaño del río: es un adjective.'},{q:'Which word is a verb?',opts:['small','river','play'],a:2,why:'Play es una acción: es un verb.'}];const build=[{words:['The','happy','dog','runs','.'],hint:'El perro feliz corre.',target:'the happy dog runs',why:'Dog = noun, happy = adjective, runs = verb.'},{words:['Capi','eats','a','red','apple','.'],hint:'Capi come una manzana roja.',target:'capi eats a red apple',why:'Capi/apple son nouns; eats es verb; red es adjective.'},{words:['The','small','cat','jumps','.'],hint:'El gato pequeño salta.',target:'the small cat jumps',why:'Small describe al cat; jumps es la acción.'},{words:['I','read','a','big','book','.'],hint:'Leo un libro grande.',target:'i read a big book',why:'Read es verb, book es noun y big es adjective.'}];const write=[{ask:'Escribe en inglés: El perro es feliz.',example:'The dog is happy.',keys:['dog','happy'],tip:'Comienza con The dog...'}, {ask:'Escribe en inglés: El gato corre.',example:'The cat runs.',keys:['cat','runs'],tip:'The cat... y después la acción.'},{ask:'Escribe en inglés: La pelota es roja.',example:'The ball is red.',keys:['ball','red'],tip:'The ball is...'}, {ask:'Escribe en inglés: Capi come una manzana.',example:'Capi eats an apple.',keys:['capi','eats','apple'],tip:'Capi eats...'}];let state={};function home(){game=null;app.innerHTML=`<section class="hero"><div><div class="eyebrow">Misión escolar · Semana 1</div><h2>¡Bienvenido al Reino de las Palabras! ✨</h2><p>Ayuda a Capi a descubrir los <b>nouns</b>, <b>verbs</b> y <b>adjectives</b>. Lee, piensa y escribe para recuperar las estrellas del reino.</p><button class="primary" onclick="lesson()">📖 Primero: aprende las 3 reglas</button></div><div class="mascot" aria-hidden="true">🦫</div></section><div class="sectionhead"><h3>🗺️ Elige tu misión</h3><span class="tag">+10 monedas por respuesta correcta</span></div><section class="grid">${[['identify','🔍','Detective de palabras','Descubre nouns, verbs y adjectives en oraciones.'],['read','📚','El cuento de Capi','Lee una historia y demuestra qué entendiste.'],['build','🧩','Constructor de frases','Ordena palabras para crear oraciones.'],['write','✏️','Desafío de escritura','Escribe frases tú solo, con pistas si las necesitas.']].map(([id,emoji,title,desc])=>`<article class="world"><span class="symbol">${emoji}</span><h4>${title}</h4><p>${desc}</p><button class="secondary" onclick="start('${id}')">${saved.finished[id]?'✅ Repetir':'🎮 Jugar'}</button></article>`).join('')}</section><div class="panel"><b>👨‍👩‍👦 Para la familia</b><p>Recomendación: 15 minutos diarios. Pídele que lea en voz alta y explique en español por qué eligió cada respuesta. Las pistas están disponibles y los errores no quitan monedas.</p><button class="mini" onclick="if(confirm('¿Borrar todas las monedas, estrellas y misiones completadas en este navegador?')){saved={coins:0,stars:0,finished:{}};save();home()}">Reiniciar progreso</button></div>`;hud()}function lesson(){app.innerHTML=`<section class="activity"><div class="eyebrow">Antes de jugar</div><h2>🔎 El secreto de las 3 palabras</h2><p>Las oraciones son como un videojuego: tienen personajes y cosas, acciones y detalles.</p><div class="grid">${Object.values(definitions).map(d=>`<div class="panel"><div style="font-size:38px">${d.emoji}</div><h3 style="color:${d.color}">${d.name}</h3><b>${d.es}</b><p>${d.intro}</p><div class="tip">${d.ex}</div></div>`).join('')}</div><div class="panel"><div class="big" style="font-size:26px"><span style="color:var(--blue)">The dog</span> <span style="color:var(--green)">is</span> <span style="color:var(--pink)">fast</span>.</div><p>🐕 <b>dog</b> = noun (¿quién?) · 🏃 <b>is</b> = verb (verbo ser/estar) · ⚡ <b>fast</b> = adjective (¿cómo es?)</p><button class="secondary" onclick="speak('The dog is fast')">🔊 Escuchar oración</button></div><div class="actions"><button class="secondary" onclick="home()">← Volver</button><button class="primary" onclick="start('identify')">¡Entendido! Jugar →</button></div></section>`}function start(type){game=type;state={idx:0,correct:0,answered:false,selected:[],hint:false};render()}function bar(total){return `<div class="eyebrow">${{identify:'Detective de palabras',read:'Comprensión lectora',build:'Constructor de frases',write:'Escritura'}[game]} · Pregunta ${state.idx+1} de ${total}</div><div class="progress"><div class="fill" style="width:${Math.round(state.idx/total*100)}%"></div></div>`}function shell(content){app.innerHTML=`<section class="activity">${content}<div id="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="secondary" onclick="home()">← Mapa</button><button class="primary hidden" id="next" onclick="advance()">Continuar →</button></div></section>`}function reply(correct,reason){if(state.answered)return;state.answered=true;if(correct){state.correct++;saved.coins+=10;save()}$('feedback').innerHTML=`<div class="notice ${correct?'success':'error'}">${correct?'🌟 ¡Excelente! +10 monedas':'💪 ¡Buen intento!'}<div>${escapeHtml(reason)}</div></div>`;$('next').classList.remove('hidden')};function render(){if(game==='identify'){let q=qs[state.idx];shell(`${bar(qs.length)}<h2>¿Qué tipo de palabra es?</h2><p>Lee la oración. La palabra que debes identificar está resaltada en AMARILLO.</p><div class="panel big">${q[0]}</div><div class="answers">${Object.entries(definitions).map(([id,d])=>`<button class="answer" data-choice="${id}" onclick="chooseCategory('${id}')">${d.emoji} ${d.name}<br><small>${d.es}</small></button>`).join('')}</div><div class="actions"><button class="secondary" onclick="speak('${q[0].replace(/<[^>]*>/g,'').replaceAll("'","\\'")}')">🔊 Escuchar</button></div>`)}else if(game==='read'){let q=comprehension[state.idx];shell(`${bar(comprehension.length)}<h2>📚 Capi y su nuevo amigo</h2><p>Lee el cuento. Usa el audio solo si lo necesitas.</p><div class="panel story" lang="en">${story}</div><button class="secondary" onclick="speak('Capi is a small capybara. He lives near a big river. Every morning, Capi runs to the park. He sees a happy dog. The dog has a red ball. Capi and the dog play together.')">🔊 Escuchar cuento</button><h3>${escapeHtml(q.q)}</h3><div class="answers">${q.opts.map((o,i)=>`<button class="answer" onclick="chooseRead(${i})">${escapeHtml(o)}</button>`).join('')}</div>`)}else if(game==='build'){let q=build[state.idx];shell(`${bar(build.length)}<h2>🧩 Construye una oración</h2><p>Forma la oración en inglés: <b>${escapeHtml(q.hint)}</b></p><div class="panel"><div class="selected" id="selected">Toca las palabras en orden...</div></div><div class="tiles" id="tiles"></div><div class="actions"><button class="secondary" onclick="state.selected=[];tiles()">↺ Intentar de nuevo</button><button class="primary" onclick="checkBuild()">Comprobar</button></div>`);tiles()}else{let q=write[state.idx];shell(`${bar(write.length)}<h2>✏️ Escribe como un campeón</h2><p>${escapeHtml(q.ask)}</p><label for="written">Tu oración en inglés:</label><input class="field" id="written" autocomplete="off" spellcheck="false" placeholder="Escribe aquí..."><div class="actions"><button class="secondary" onclick="$('tip').classList.toggle('hidden')">💡 Ver pista</button><button class="secondary" onclick="speak('${q.example.replaceAll("'","\\'")}')">🔊 Escuchar oración</button><button class="primary" onclick="checkWrite()">Comprobar</button></div><p class="tip hidden" id="tip">Pista: ${escapeHtml(q.tip)}</p>`);$('written').addEventListener('keydown',e=>{if(e.key==='Enter')checkWrite()})}}function chooseCategory(a){if(state.answered)return;let q=qs[state.idx];document.querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;if(x.dataset.choice===q[2])x.classList.add('good');else if(x.dataset.choice===a)x.classList.add('bad')});reply(a===q[2],q[3])}function chooseRead(a){if(state.answered)return;let q=comprehension[state.idx];document.querySelectorAll('.answer').forEach((x,i)=>{x.disabled=true;if(i===q.a)x.classList.add('good');else if(i===a)x.classList.add('bad')});reply(a===q.a,q.why)}function tiles(){let q=build[state.idx];$('selected').innerHTML=state.selected.length?state.selected.map(x=>`<span>${escapeHtml(q.words[x])}</span>`).join(' '):'Toca las palabras en orden...';$('tiles').innerHTML=q.words.map((x,i)=>state.selected.includes(i)?'':`<button class="tile" onclick="state.selected.push(${i});tiles()">${escapeHtml(x)}</button>`).join('')}function norm(s){return s.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim()}function checkBuild(){if(state.answered)return;let q=build[state.idx],txt=state.selected.map(i=>q.words[i]).join(' ');reply(norm(txt)===q.target,q.why+' Ejemplo: '+q.words.join(' ').replace(' .','.'))}function checkWrite(){if(state.answered)return;let q=write[state.idx],v=norm($('written').value);if(!v){$('written').focus();return}let good=norm(q.example)===v;let partial=q.keys.every(k=>v.split(' ').includes(k));reply(good||partial&&v.split(' ').length>=q.keys.length+1,good?'¡Oración escrita perfectamente!':'Modelo recomendado: '+q.example);$('written').disabled=true}function advance(){const totals={identify:qs.length,read:comprehension.length,build:build.length,write:write.length};state.idx++;state.answered=false;if(state.idx>=totals[game]){let first=!saved.finished[game];saved.finished[game]=true;if(first)saved.stars+=3;save();app.innerHTML=`<section class="activity" style="text-align:center"><div style="font-size:94px">🏆🦫</div><div class="eyebrow">Misión terminada</div><h2>¡Lo lograste!</h2><p>Acertaste <b>${state.correct} de ${totals[game]}</b> desafíos. ${first?'¡Ganaste 3 estrellas nuevas!':'Has reforzado tu aprendizaje.'}</p><div class="actions" style="justify-content:center"><button class="primary" onclick="home()">🗺️ Volver al reino</button><button class="secondary" onclick="start('${game}')">🔄 Jugar otra vez</button></div></section>`}else render()}hud();home();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
